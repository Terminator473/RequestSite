<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Work Experience</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="experience" class="experience">
        <h1 class="workTitle">My Specialty</h1>
        <p class="workParagraph">I have worked in the AV technician field for 3 years, with experience in hanging TV's and soundbars!
        Provided that you have the mounts, I can do this for you!</p>
    </div>

    <div id="aboutMe" class="aboutMe">
        <h1 class="meTitle">About Me</h1>
    </div>

    <div id="form" class="form">
        <h1 class="request">Request Work</h1>
        <form action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="d293dd32-475a-4d7d-a5d7-8fa415cef91a">
            <label class="inputs">
                <input class="first" type="text" placeholder="First Name" name="firstName" required>
                <input class="last" type="text" placeholder="Last Name" name="lastName" required>
                <input class="email" type="email" placeholder="Email Address" name="email" required>
                <input class="phone" type="text" placeholder="Phone Number" name="phoneNumber" required>
                <input class="submit" type="submit" value="Submit">
            </label>
        </form>
    </div>
</body>
</html>
